[package]
name = "agent-preflight"
version = "0.1.0"
edition = "2024"
authors = ["Gabriele Picco <piccogabriele@gmail.com>"]
repository = "https://github.com/GabrielePicco/preflight"
description = "Pre-flight guard for coding agents: blocks launch when untrusted instruction files are in reach"
license = "MIT"
readme = "README.md"
keywords = ["security", "ai-agents", "codex", "claude-code", "cli"]
categories = ["command-line-utilities"]
exclude = ["demo/*.png", ".github/**"]

[lib]
name = "preflight"

[[bin]]
name = "preflight"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
owo-colors = "4.4.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.8"
walkdir = "2.5.0"

[target."cfg(unix)".dependencies]
xattr = "1.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.8"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
